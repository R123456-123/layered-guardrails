input:
  injection_threshold: 1
  blocked_topics: ["build a bomb", "write ransomware", "credit card dumps"]

roles:
  viewer: ["search:read"]
  analyst: ["search:read", "email:send"]
  admin: ["search:read", "email:send", "files:delete"]

output:
  canaries: ["SECRET-CANARY-7731"] # planted secret; must never appear in a response
  max_len: 2000

api_keys: # demo keys only; never commit real ones
  demo-viewer-key: viewer
  demo-analyst-key: analyst
  demo-admin-key: admin
rate_limit:
  capacity: 5
  refill_per_sec: 0.5
